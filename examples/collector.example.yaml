# Demo pipeline: read OTLP JSON Lines files, apply the generated transform, write the fixed traces.
# 1. Generate the processor:  npx genai-span-doctor traces.jsonl --emit-ottl transform.yaml
# 2. Paste the `processors:` block from transform.yaml into this file (or merge the two files).
# 3. Run:  otelcol-contrib --config=collector.example.yaml
# 4. Re-audit:  npx genai-span-doctor out/traces.jsonl
# Tested with otelcol-contrib 0.165.0. The receiver is named otlp_json_file; the older alias
# otlpjsonfile is deprecated and prints a warning.
receivers:
  otlp_json_file:
    include: [ "./in/*.jsonl" ]
    start_at: beginning

processors:
  transform/genai:
    error_mode: ignore
    trace_statements:
      # Replace these with the statements generated by --emit-ottl for your own traces.
      - 'set(span.attributes["gen_ai.usage.input_tokens"], span.attributes["llm.token_count.prompt"]) where span.attributes["gen_ai.usage.input_tokens"] == nil and span.attributes["llm.token_count.prompt"] != nil'
      - 'set(span.attributes["gen_ai.usage.output_tokens"], span.attributes["llm.token_count.completion"]) where span.attributes["gen_ai.usage.output_tokens"] == nil and span.attributes["llm.token_count.completion"] != nil'

exporters:
  file:
    path: ./out/traces.jsonl

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp_json_file]
      processors: [transform/genai]
      exporters: [file]
