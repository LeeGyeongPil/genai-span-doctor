# No API keys or network services are needed: the tool is offline and deterministic.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly check that dependencies and runtimes did not break the build
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  collector-e2e:
    # Runs the generated OTTL through a real OpenTelemetry Collector (contrib 0.165.0).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download otelcol-contrib 0.165.0
        run: |
          curl -fsSL -o otelcol.tar.gz https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.165.0/otelcol-contrib_0.165.0_linux_amd64.tar.gz
          mkdir -p "$RUNNER_TEMP/otelcol"
          tar -xzf otelcol.tar.gz -C "$RUNNER_TEMP/otelcol" otelcol-contrib
      - run: npm test
        env:
          OTELCOL_BIN: ${{ runner.temp }}/otelcol/otelcol-contrib
